# Build the VitePress site and deploy it to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits for the running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Check for custom domain
        id: check-domain
        run: |
          CNAME=$(gh api repos/${{ github.repository }}/pages --jq '.cname // empty')
          if [ -n "$CNAME" ]; then
            echo "has_custom_domain=true" >> $GITHUB_OUTPUT
            echo "cname=$CNAME" >> $GITHUB_OUTPUT
          else
            echo "has_custom_domain=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: |
          # Without a custom domain the site lives under /<repository>/
          if [ "${{ steps.check-domain.outputs.has_custom_domain }}" = "false" ]; then
            export VITEPRESS_BASE=/${GITHUB_REPOSITORY#*/}/
          else
            export SITE_URL=https://${{ steps.check-domain.outputs.cname }}
          fi
          npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
